[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    test_trainers: marks testing of trainers (algorithms)
    parallel: lightweight tests using more than one execution device
    jax_multidevice: tests that require a specified number of JAX devices
    mpi: integration tests that must be launched under MPI
    multihost: opt-in tests for a JAX distributed process topology
