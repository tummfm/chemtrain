syntax = "proto3";

package jcn;

message Model {

  string mlir_module = 1;

  enum NeighborListType {
    UNSPECIFIED = 0;
    DEVICE_SPARSE = 1;
    SIMPLE_DENSE = 2;
    SIMPLE_SPARSE = 3;
  }

  message NeighborList {
    NeighborListType type = 1;
    float cutoff = 2;

    // To which order neighbors are required for the newton and the
    // non-newton setting
    repeated int32 nbr_order = 3;

    optional bool half_list = 4; // Expect only a half neighbor list

    // Keys for returned statistics
    repeated string statistics_keys = 5;

  }

  NeighborList neighbor_list=4;

  optional string unit_style = 5; // LAMMPS unit style definition

  // Return additional quantities besides the energy and force

  repeated string quantities = 6;

}
